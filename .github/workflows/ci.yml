name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins Rust and its components.
      - name: Install sqlite3 and report versions
        run: |
          sudo apt-get update && sudo apt-get install -y sqlite3
          rustc --version && cargo --version && sqlite3 --version

      # Cache keys include the toolchain and lockfile.
      - uses: Swatinem/rust-cache@v2

      # `make check` validates sqlx queries against current migrations.
      - name: fmt, tests, clippy
        run: make check
